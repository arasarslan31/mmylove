<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    background: black;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
  }

  .slide {
    height: 100vh;
    scroll-snap-align: start;
    padding: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 16px;
  }

  /* DOKUN EKRANI */
  #touch-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    color: white;
    font-size: 48px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    cursor: pointer;
  }

  @media (max-width: 768px) {
    .slide {
      padding: 20px;
    }

    #touch-screen {
      font-size: 36px;
    }
  }
</style>
</head>
