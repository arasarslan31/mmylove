<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Love</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: black;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .slide {
      min-height: 100vh;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px; /* 👈 KENAR BOŞLUK */
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* 👈 KESME YOK */
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      .slide {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

    <img src="IMG_20251225-WA0003.jpg">

  <div class="slide">

</body>
</html>
