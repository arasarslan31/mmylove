<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: black;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      font-family: Arial, sans-serif;
    }

    /* SLIDE */
    .slide {
      height: 100vh;
      scroll-snap-align: start;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* kesilmez */
      border-radius: 16px;
    }

    /* DOKUN EKRANI */
    #touch-screen {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      font-weight: bold;
      z-index: 9999;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .slide {
        padding: 20px;
      }

      #touch-screen {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <!-- MÜZİK -->
  <audio id="bg-music" loop>
    <source src="musicmarlboro.m4a" type="audio/mp4">
  </audio>

  <!-- DOKUN -->
  <div id="touch-screen">DOKUN!</div>

  <!-- FOTOĞRAFLAR -->
  <div class="slide"><img src="IMG_20260118_171908.png"></div>
  <div class="slide"><img src="IMG_20260118_172008.jpg"></div>
  <div class="slide"><img src="IMG_20260118_143717.png"></div>
  <div class="slide"><img src="IMG_20260118_141905.jpg"></div>
  <div class="slide"><img src="IMG-20250916-WA0001.jpg"></div>
  <div class="slide"><img src="IMG_20260118_165449.jpg"></div>
  <div class="slide"><img src="IMG-20260118-WA0008.jpg"></div>
  <div class="slide"><img src="IMG_20260118_142000.jpg"></div>
  <div class="slide"><img src="IMG_20260118_181519.jpg"></div>
  <div class="slide"><img src="IMG_20260118_143243.png"></div>
  <div class="slide"><img src="IMG_20260118_143216.jpg"></div>
  <div class="slide"><img src="1768735623851.png"></div>
  <div class="slide"><img src="IMG_20260118_142045.jpg"></div>
  <div class="slide"><img src="IMG_20260118_142014.jpg"></div>

  <!-- JS (iPhone uyumlu) -->
  <script>
    const touchScreen = document.getElementById("touch-screen");
    const audio = document.getElementById("bg-music");

    audio.volume = 0.3;

    function startSite() {
      audio.play().catch(() => {});
      touchScreen.style.display = "none";
      document.removeEventListener("click", startSite);
      document.removeEventListener("touchstart", startSite);
    }

    document.addEventListener("click", startSite);
    document.addEventListener("touchstart", startSite);
  </script>

</body>
</html>
