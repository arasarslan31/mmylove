<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #0a0a0a, #111111);  /* canlı doğum günü degrade */ 
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y proximity;
      overscroll-behavior: none;
      font-family: Arial, sans-serif;
    }

    .slide {
      height: 100vh;
      scroll-snap-align: start;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.5s ease, filter 0.5s ease;
      transform: translateY(0px) scale(0.95);
      filter: blur(2px);
    }

    .slide img.visible {
      opacity: 1;
      transform: translateY(0px) scale(1);
      filter: blur(0);
    }

    #touch-screen {
      position: fixed;
      inset: 0;
      background: transparent; /* saydam yaptık, degrade görülsün */
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      font-weight: bold;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.6s ease;
      animation: pulse 1.2s infinite, glow 2s infinite alternate;
      text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.5);
    }

    #birthday-message {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 64px;
      font-weight: bold;
      color: #ff0066;
      text-shadow: 0 0 10px #fff, 0 0 20px #ff69b4;
      opacity: 0;
      pointer-events: none;
      z-index: 9998;
      transition: opacity 1s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes glow {
      0% { text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.3); }
      50% { text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.5); }
      100% { text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 20px rgba(255,255,255,0.3); }
    }

    @media (max-width: 768px) {
      .slide {
        padding: 20px;
      }

      #touch-screen {
        font-size: 40px;
      }

      #birthday-message {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <audio id="bg-music" loop preload="auto">
    <source src="musicmarlboro.m4a" type="audio/mp4">
  </audio>

  <div id="touch-screen">DOKUN!</div>
  <div id="birthday-message">DOĞUM GÜNÜN KUTLU OLSUN!</div>

  <div class="slide"><img src="IMG_20260118_171908.png"></div>
  <div class="slide"><img src="IMG_20260118_172008.jpg"></div>
  <div class="slide"><img src="IMG_20260118_143717.png"></div>
  <div class="slide"><img src="IMG_20260118_141905.jpg"></div>
  <div class="slide"><img src="IMG-20250916-WA0001.jpg"></div>
  <div class="slide"><img src="IMG_20260118_165449.jpg"></div>
  <div class="slide"><img src="IMG-20260118-WA0008.jpg"></div>
  <div class="slide"><img src="IMG_20260118_142000.jpg"></div>
  <div class="slide"><img src="IMG_20260118_181519.jpg"></div>
  <div class="slide"><img src="IMG_20260118_143243.png"></div>
  <div class="slide"><img src="IMG_20260118_143216.jpg"></div>
  <div class="slide"><img src="1768735623851.png"></div>
  <div class="slide"><img src="IMG_20260118_142045.jpg"></div>
  <div class="slide"><img src="IMG_20260118_142014.jpg"></div>

  <script>
    const touchScreen = document.getElementById("touch-screen");
    const birthdayMessage = document.getElementById("birthday-message");
    const audio = document.getElementById("bg-music");

    audio.volume = 0.3;
    audio.setAttribute("playsinline", "");

    function showPhotos() {
      document.querySelectorAll('.slide img')
        .forEach(img => img.classList.add('visible'));
    }

    function startBirthday() {
      birthdayMessage.style.opacity = 1;

      // Basit konfeti efekti
      for(let i=0; i<150; i++){
        const confetti = document.createElement('div');
        confetti.style.position = 'fixed';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 60%)`;
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.top = Math.random() * -window.innerHeight + 'px';
        confetti.style.borderRadius = '50%';
        confetti.style.zIndex = 9997;
        confetti.style.opacity = Math.random();
        confetti.style.pointerEvents = 'none';
        document.body.appendChild(confetti);

        const speed = 2 + Math.random()*3;
        let top = parseFloat(confetti.style.top);
        const fall = () => {
          top += speed;
          confetti.style.top = top + 'px';
          if(top < window.innerHeight){
            requestAnimationFrame(fall);
          } else {
            confetti.remove();
          }
        }
        fall();
      }
    }

    function startSite() {
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          touchScreen.style.opacity = 0;
          setTimeout(() => {
            touchScreen.style.display = "none";
            showPhotos();
            startBirthday();
          }, 600);
        }).catch((error) => {
          console.log("Audio çalınamadı", error);
        });
      } else {
        touchScreen.style.display = "none";
        showPhotos();
        startBirthday();
      }
    }

    touchScreen.addEventListener("click", startSite);
    touchScreen.addEventListener("touchstart", startSite);

    // Parallax ve blur efektleri (sadece görsel efekt, kaydırma yaptırmaz)
    window.addEventListener('scroll', () => {
      const slides = document.querySelectorAll('.slide img');
      slides.forEach(img => {
        const rect = img.getBoundingClientRect();
        const windowHeight = window.innerHeight;
        const offset = (rect.top - windowHeight/2) / windowHeight;
        img.style.transform = `translateY(${offset * 20}px) scale(1)`;
        img.style.filter = `blur(${Math.abs(offset) * 2}px)`;
      });
    });
  </script>

</body>
</html>
